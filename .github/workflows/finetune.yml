name: finetune

# 追加学習 (LoRA) の通しの確認: 練習用の台帳から学習データを書き出し、MLX で小さなモデル (Qwen3.5 0.8B) を学習し、
# GGUF の差分に変え、組み立てたアプリの評価ハーネスで「差分なし / 差分あり」を比べる。
# MLX は Apple シリコンでしか動かないので、ここ (GitHub の Mac) でだけ確かめられる。時間がかかるので、関係するファイルが変わったときだけ動かす
on:
  push:
    paths:
      - "tools/finetune/**"
      - ".github/workflows/finetune.yml"
      - "Sources/KikimimiCore/LLM/FineTuneData.swift"
      - "Sources/KikimimiCore/LLM/LLMEval.swift"
      - "Sources/Kikimimi/TrainingExport.swift"
      - "Sources/Kikimimi/LLMEvalRunner.swift"
      - "Sources/KikimimiLLM/LlamaEngine.swift"
  workflow_dispatch:

permissions:
  contents: read

# 新しい push が来たら、同じブランチの古い実行は止める (Mac の実行枠は少なく、1 回が長い)
concurrency:
  group: finetune-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lora:
    name: LoRA end to end (macos-15, Qwen3.5 0.8B)
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || true
          swift --version
          sysctl -n hw.memsize hw.ncpu

      - name: Fetch the XCFrameworks
        run: |
          for attempt in 1 2 3 4; do
            if swift package resolve; then exit 0; fi
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts .build/artifacts
            sleep $((attempt * 30))
          done
          exit 1

      - name: Build Kikimimi.app
        run: Scripts/build-app.sh

      - name: Python environment (mlx-lm, gguf)
        run: |
          python3 -m venv .venv-finetune
          .venv-finetune/bin/pip install --quiet "mlx-lm[train]" gguf numpy
          .venv-finetune/bin/pip list 2>/dev/null | grep -i -E "^(mlx|mlx-lm|gguf|numpy|transformers) "

      - name: Is MLX usable here (GPU / CPU)?
        continue-on-error: true
        run: |
          .venv-finetune/bin/python - <<'PY'
          import mlx.core as mx
          print("default device:", mx.default_device(), "metal available:", mx.metal.is_available())
          a = mx.ones((64, 64)); print("gpu matmul:", (a @ a).sum().item())
          PY

      - name: Fetch Qwen3.5 0.8B (GGUF, the file the app would use)
        run: |
          mkdir -p build/models
          for attempt in 1 2 3 4; do
            if curl -fsSL -o build/models/qwen3.5-0.8b.gguf \
                 https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_K_M.gguf; then break; fi
            sleep $((attempt * 20))
          done
          echo "bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517  build/models/qwen3.5-0.8b.gguf" | shasum -a 256 -c

      # アプリが書き出すのと同じ学習データ (練習用の台帳: 12 件の直しと、直す必要のない 36 行)
      - name: Export the training data with the app
        run: |
          build/Kikimimi.app/Contents/MacOS/Kikimimi --export-training build/training.jsonl \
            --ledger tools/finetune/selftest/ledger.json --clean tools/finetune/selftest/clean.txt
          wc -l build/training.jsonl
          head -c 600 build/training.jsonl

      # GitHub の Mac は仮想 GPU・3 コアで、LLM がとても遅い (0.8B で 11 場面の評価 1 回に、CPU で 9 分・Metal で 13 分。
      # Linux の CPU では 41 秒。MLX の学習は 1 回に 15 秒ほど)。評価は小さな場面 (3 場面 + 確認用の例から作る場面) を CPU で。
      # 学習は MLX の GPU (CPU では 30 分たっても進まなかった)

      # 学習 → 変換 → 評価 (差分なし / 差分あり)。評価が悪い・効き目が無いときの終了コード (3 / 4) では止めず、次の手順で中身を確かめる
      - name: Train with MLX, convert to GGUF, evaluate with the app
        timeout-minutes: 240
        run: |
          set -o pipefail
          code=0
          .venv-finetune/bin/python tools/finetune/finetune.py --data build/training.jsonl --model qwen3.5-0.8b \
            --gguf build/models/qwen3.5-0.8b.gguf --out build/finetune --cpu \
            --eval-set tools/finetune/selftest/eval-mini.json 2>&1 | tee build/train.log || code=$?
          echo "finetune.py exit code: $code"
          ls -la build/finetune build/finetune/adapters
          test "$code" = 0 -o "$code" = 3 -o "$code" = 4

      # 学習した語を、モデルそのもの (台帳なし) が直せるようになったか。正しい行は壊していないか
      - name: Did the adapter learn the corrections?
        run: |
          .venv-finetune/bin/python - <<'PY'
          import json
          base, new = json.load(open("build/finetune/eval-base.json")), json.load(open("build/finetune/eval-adapter.json"))
          def found(r): return r["audit"]["fixedAutomatically"] + r["audit"]["fixedBySuggestion"]
          print("base   :", json.dumps(base["audit"]))
          print("adapter:", json.dumps(new["audit"]))
          print("\n".join(new["details"]))
          assert new["audit"]["harmed"] <= base["audit"]["harmed"], "the adapter harmed correct lines"
          assert found(new) > found(base), f"the adapter did not fix more lines ({found(base)} -> {found(new)})"
          print(f"fixed (incl. suggestions): {found(base)} -> {found(new)} of {new['audit']['errorLines']}; wrong fixes {new['audit']['wrongFixes']}")
          PY

      # 変換だけの確認: 中身が 0 の差分は、出力を変えない (MLX なしで作った差分。向きや名前の取り違えは、ここで読み込めずに止まる)
      - name: Converter check (a zero adapter changes nothing)
        timeout-minutes: 20
        run: |
          .venv-finetune/bin/python tools/finetune/selftest/make_zero_adapter.py build/zero-adapter
          .venv-finetune/bin/python tools/finetune/mlx_lora_to_gguf.py build/zero-adapter build/models/qwen3.5-0.8b.gguf build/zero.lora.gguf
          APP=build/Kikimimi.app/Contents/MacOS/Kikimimi
          SET=tools/finetune/selftest/eval-mini.json
          $APP --eval-llm build/models/qwen3.5-0.8b.gguf --set $SET --cpu --report build/eval-plain.json
          $APP --eval-llm build/models/qwen3.5-0.8b.gguf --adapter build/zero.lora.gguf --set $SET --cpu \
            --report build/eval-zero.json --baseline build/eval-plain.json
          .venv-finetune/bin/python - <<'PY'
          import json
          a, b = json.load(open("build/eval-plain.json")), json.load(open("build/eval-zero.json"))
          for r in (a, b): r["audit"]["seconds"] = 0; r.pop("adapter", None)
          assert a["audit"] == b["audit"] and a["details"] == b["details"], "a zero adapter changed the result"
          print("zero adapter: same result as no adapter")
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: finetune-selftest
          path: |
            build/finetune/*.json
            build/finetune/*.yaml
            build/finetune/adapters/adapter_config.json
            build/eval-*.json
            build/train.log
            build/training.jsonl
          retention-days: 14
