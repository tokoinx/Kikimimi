name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS 15 / Xcode ${{ matrix.xcode }}
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 16.2: Swift 6.0。macOS 14 Sonoma で動く最後の Xcode (利用者の環境に合わせる)
        # 26.3: 最新の Xcode / Swift
        xcode: ["16.2", "26.3"]
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          XCODE="/Applications/Xcode_${{ matrix.xcode }}.app"
          if [ -d "$XCODE" ]; then
            sudo xcode-select -s "$XCODE"
          else
            echo "::warning::$XCODE is not on this runner image; using the default Xcode"
          fi
          xcodebuild -version
          swift --version

      # SwiftPM の共有キャッシュに前の実行の残りがあると、XCFramework の取得が
      # 「already exists in file system」で止まる (2026-11-09 に両方の Xcode で起きた)。毎回空にしてから取得する
      - name: Clear the SwiftPM artifact cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts

      - name: Unit tests (KikimimiCore)
        run: swift test

      - name: Build Kikimimi.app
        run: Scripts/build-app.sh

      - name: Check the app bundle
        run: |
          APP=build/Kikimimi.app
          test -x "$APP/Contents/MacOS/Kikimimi"
          test -d "$APP/Contents/Frameworks/whisper.framework"
          test -d "$APP/Contents/Frameworks/llama.framework"
          plutil -lint "$APP/Contents/Info.plist"
          otool -l "$APP/Contents/MacOS/Kikimimi" | grep -A2 LC_RPATH
          otool -L "$APP/Contents/MacOS/Kikimimi" | grep whisper.framework
          otool -L "$APP/Contents/MacOS/Kikimimi" | grep llama.framework
          codesign --verify --strict --verbose=2 "$APP"

      # 乱数の重みの小さな GGUF (本物の Qwen2 の語彙) で、組み立てたアプリの LLM 部分をひと通り動かす。
      # whisper.framework と llama.framework を同じプロセスで使えることの確認も兼ねる。
      - name: Make a tiny test GGUF
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet gguf numpy
          curl -fsSL -o build/ggml-vocab-qwen2.gguf \
            https://raw.githubusercontent.com/ggml-org/llama.cpp/b12211/models/ggml-vocab-qwen2.gguf
          .venv/bin/python Scripts/make-tiny-gguf.py build/ggml-vocab-qwen2.gguf build/tiny.gguf chatml-think

      - name: LLM self-test (CPU)
        run: build/Kikimimi.app/Contents/MacOS/Kikimimi --selftest-llm build/tiny.gguf --cpu

      - name: LLM self-test (Metal)
        # GitHub の Mac は仮想 GPU なので、Metal が使えないことがある (結果は参考)
        continue-on-error: true
        run: build/Kikimimi.app/Contents/MacOS/Kikimimi --selftest-llm build/tiny.gguf

      - name: Zip the app
        run: ditto -c -k --keepParent build/Kikimimi.app "build/Kikimimi-xcode${{ matrix.xcode }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: Kikimimi-xcode${{ matrix.xcode }}
          path: build/Kikimimi-xcode${{ matrix.xcode }}.zip
          retention-days: 14
